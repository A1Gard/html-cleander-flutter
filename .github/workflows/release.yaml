name: Build Flutter Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux
        run: flutter build linux --release

      - name: Create archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="html-cleaner-flutter-${VERSION}-linux-amd64.tar.gz"

          tar -czf "${ARCHIVE}" \
            -C build/linux/x64/release/bundle .

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            2>/dev/null || true

          gh release upload \
            "${GITHUB_REF_NAME}" \
            "html-cleaner-flutter-${GITHUB_REF_NAME}-linux-amd64.tar.gz" \
            --clobber


  build-windows:
    name: Build Windows amd64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows
        run: flutter build windows --release

      - name: Create archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $archive = "html-cleaner-flutter-${version}-windows-amd64.zip"

          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath $archive

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --title "${{ github.ref_name }}" `
            --generate-notes `
            2>$null

          gh release upload `
            "${{ github.ref_name }}" `
            "html-cleaner-flutter-${{ github.ref_name }}-windows-amd64.zip" `
            --clobber


  build-macos:
    name: Build macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check architecture
        run: |
          uname -m

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS Intel
        run: flutter build macos --release

      - name: Create archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="html-cleaner-flutter-${VERSION}-macos-intel.zip"

          cd build/macos/Build/Products/Release
          zip -r "../../../../../${ARCHIVE}" *.app

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            2>/dev/null || true

          gh release upload \
            "${GITHUB_REF_NAME}" \
            "html-cleaner-flutter-${GITHUB_REF_NAME}-macos-intel.zip" \
            --clobber
